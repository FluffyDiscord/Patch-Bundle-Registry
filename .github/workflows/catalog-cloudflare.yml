name: Manage Cloudflare catalog
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Provision, migrate, import, verify or recover the catalog
        type: choice
        options: [provision, migrate, seed, verify, checkpoint, restore, rebuild, prune]
        required: true
      generation:
        description: Ready generation ID for verify or restore; empty selects active
        type: string
        default: ''
      api_url:
        description: Optional staging or production HTTPS API URL for complete REST/GraphQL history parity checks (verify only)
        type: string
        default: ''
      confirmation:
        description: RESTORE for rollback, REBUILD for database replacement, PRUNE for cleanup; empty prune is dry-run
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  manage:
    runs-on: ubuntu-latest
    environment: catalog-maintenance
    env:
      OPERATION: ${{ inputs.operation }}
      GENERATION: ${{ inputs.generation }}
      CONFIRMATION: ${{ inputs.confirmation }}
      CATALOG_VERIFY_API_URL: ${{ inputs.api_url }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CATALOG_D1_ID: ${{ vars.CATALOG_D1_ID }}
      CATALOG_D1_NAME: ${{ vars.CATALOG_D1_NAME }}
      CATALOG_R2_BUCKET: ${{ vars.CATALOG_R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bundles
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-cloudflare.txt
      - run: npm ci
      - name: Apply reviewed additive schema
        if: inputs.operation == 'migrate'
        env:
          CATALOG_BACKEND: d1
        run: |
          node scripts/configure_cloudflare.mjs
          npx wrangler d1 migrations apply DB --remote --config worker/wrangler.generated.json --env production
      - name: Restore current progress before checkpointing
        if: inputs.operation == 'checkpoint'
        run: |
          python -m scripts.cloudflare_catalog download
          python -m scripts.cloudflare_catalog resume
      - name: Run management operation
        if: inputs.operation != 'migrate'
        shell: bash
        run: |
          args=("$OPERATION")
          if [ -n "$GENERATION" ]; then args+=(--generation "$GENERATION"); fi
          if [ -n "$CONFIRMATION" ]; then args+=(--confirm "$CONFIRMATION"); fi
          python -m scripts.cloudflare_catalog "${args[@]}"
      - name: Verify all public historical API records
        if: inputs.operation == 'verify' && inputs.api_url != ''
        run: node scripts/verify_history_api.mjs
