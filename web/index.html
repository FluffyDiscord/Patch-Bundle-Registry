<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Patch Bundle Registry</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,100&display=swap" rel="stylesheet">
        <script src="theme.js"></script>
        <link rel="stylesheet" href="style.css">
        <link rel="icon" href="favicon.svg">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>
    </head>
    <body>
    <div class="container grid-view-enabled">
        <div class="page-header">
            <div>
                <h1>Patch Bundle Registry</h1>
                <p class="subtitle">Search ReVanced, ReSeam, and Morphe patch bundles</p>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="admin-access icon-button" type="button"
                        aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false">
                    <svg class="theme-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path d="M20.9 13.3A9 9 0 0 1 10.7 3.1a9 9 0 1 0 10.2 10.2Z"/>
                    </svg>
                    <svg class="theme-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"/>
                        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                    </svg>
                </button>
                <a class="admin-access icon-button" href="https://github.com/Jman-Github/Patch-Bundle-Registry"
                   target="_blank" rel="noopener noreferrer" title="View on GitHub"
                   aria-label="View Patch Bundle Registry on GitHub (opens in a new tab)">
                    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path d="M8 0C3.58 0 0 3.58 0 8a8.01 8.01 0 0 0 5.47 7.59c.4.07.55-.17.55-.38v-1.49c-2.23.48-2.7-.95-2.7-.95-.36-.92-.89-1.17-.89-1.17-.73-.5.06-.49.06-.49.8.06 1.22.82 1.22.82.71 1.22 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 4 0c1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.28.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.74.54 1.49v2.2c0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
                    </svg>
                </a>
                <button id="admin-access" class="admin-access" type="button">Manage sources</button>
            </div>
        </div>
        <section class="catalog-statistics" aria-label="Catalog statistics">
            <div id="catalog-stats" class="catalog-stats" aria-live="polite">Loading catalog statistics...</div>
            <p class="stats-note">Newest release per source, including prereleases. Patch totals reflect available metadata.</p>
        </section>
        <div class="catalog-tabs" role="tablist" aria-label="Browse catalog">
            <button id="bundles-tab" class="catalog-tab active" role="tab" type="button" aria-selected="true" aria-controls="results">Bundles</button>
            <button id="apps-tab" class="catalog-tab" role="tab" type="button" aria-selected="false" aria-controls="results" tabindex="-1">Apps</button>
        </div>
        <p id="apps-note" class="stats-note" hidden>Patches and compatibility are counted across matching bundle versions.</p>
        <div class="search-row">
            <input
                    type="text"
                    id="search"
                    aria-label="Search bundles"
                    placeholder="Search bundles by source URL or name..."
                    autocomplete="off"
            >
            <input
                    type="text"
                    id="package-filter"
                    aria-label="Filter by package or app version, optionally package@version"
                    placeholder="Filter by package or app version (e.g., 19.16)"
                    autocomplete="off"
            >
        </div>
        <div class="filter-row">
            <label class="filter-field">
                <span>Source</span>
                <select id="source-filter">
                    <option value="">All sources</option>
                </select>
            </label>
            <label id="bundle-version-field" class="filter-field">
                <span>Bundle version</span>
                <select id="bundle-version-filter" disabled>
                    <option value="">All versions</option>
                </select>
            </label>
            <label class="filter-field">
                <span>Bundle type</span>
                <select id="bundle-type-filter">
                    <option value="">All types</option>
                </select>
            </label>
        </div>
        <div class="filter-buttons">
            <button class="filter-btn" data-filter="all">All</button>
            <button class="filter-btn" data-filter="latest">Latest</button>
            <button class="filter-btn active" data-filter="release">Release</button>
            <button class="filter-btn" data-filter="prerelease">Prerelease</button>
            <button id="view-toggle" class="view-toggle" type="button" aria-pressed="true">List view</button>
        </div>
        <div id="status">Loading bundles...</div>
        <div id="results" class="grid-view" role="tabpanel" aria-labelledby="bundles-tab">
            <div class="v-track" id="v-track"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    </body>
    </html>
